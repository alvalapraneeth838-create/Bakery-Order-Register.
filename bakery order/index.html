<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bakery Order Register</title>
  <style>
    :root {
      --cream: #fffaf2;
      --pink: #d66a86;
      --pink-dark: #ad4f69;
      --chocolate: #4a3028;
      --muted: #806d64;
      --line: #eadfd3;
      --green: #3d8062;
      --gold: #c28d43;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--chocolate);
      background:
        radial-gradient(circle at 10% 10%, #f7e4e9 0 110px, transparent 111px),
        linear-gradient(135deg, #fffaf2, #fbf1e7);
      min-height: 100vh;
    }

    button, input, select, textarea {
      font: inherit;
    }

    .app {
      max-width: 1180px;
      margin: 0 auto;
      padding: 28px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-mark {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--pink);
      color: white;
      font-size: 30px;
      box-shadow: 0 8px 18px rgba(173, 79, 105, 0.18);
    }

    h1 {
      margin: 0;
      font-size: clamp(24px, 4vw, 38px);
      letter-spacing: -1px;
    }

    .subtitle {
      margin: 5px 0 0;
      color: var(--muted);
    }

    .date {
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.7);
      border-radius: 999px;
      padding: 10px 16px;
      white-space: nowrap;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 20px;
    }

    .stat {
      background: white;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 8px 28px rgba(74, 48, 40, 0.05);
    }

    .stat span {
      display: block;
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 7px;
    }

    .stat strong {
      font-size: 24px;
    }

    .layout {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 20px;
    }

    .card {
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 12px 34px rgba(74, 48, 40, 0.07);
    }

    .card h2 {
      margin: 0 0 18px;
      font-size: 21px;
    }

    .field {
      margin-bottom: 13px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      font-weight: bold;
    }

    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: #fffdfa;
      color: var(--chocolate);
      padding: 10px 11px;
      outline: none;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--pink);
      box-shadow: 0 0 0 3px rgba(214, 106, 134, 0.12);
    }

    textarea {
      resize: vertical;
      min-height: 68px;
    }

    .two-columns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .primary {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 12px;
      background: var(--pink);
      color: white;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
    }

    .primary:hover {
      background: var(--pink-dark);
      transform: translateY(-1px);
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .search {
      max-width: 290px;
    }

    .status-filter {
      max-width: 150px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      text-align: left;
      padding: 12px 8px;
      border-bottom: 1px solid var(--line);
      font-size: 14px;
    }

    th {
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.7px;
    }

    .badge {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: bold;
    }

    .badge.Paid { background: #dff1e7; color: var(--green); }
    .badge.Partial { background: #fff0d5; color: #9a6927; }
    .badge.Unpaid { background: #fde2e8; color: #a74b60; }

    .delete {
      border: 0;
      background: transparent;
      color: var(--pink-dark);
      cursor: pointer;
      font-weight: bold;
    }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 32px 10px;
    }

    @media (max-width: 900px) {
      .stats { grid-template-columns: repeat(2, 1fr); }
      .layout { grid-template-columns: 1fr; }
    }

    @media (max-width: 560px) {
      .app { padding: 16px; }
      header { align-items: flex-start; }
      .date { display: none; }
      .stats { grid-template-columns: 1fr 1fr; }
      .stat { padding: 13px; }
      .toolbar { flex-direction: column; }
      .search, .status-filter { max-width: none; }
      .table-wrap { overflow-x: auto; }
      table { min-width: 650px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">♟</div>
        <div>
          <h1>Bakery Order Register</h1>
          <p class="subtitle">Fresh orders, neatly managed.</p>
        </div>
      </div>
      <div class="date" id="today"></div>
    </header>

    <section class="stats" aria-label="Order summary">
      <div class="stat"><span>Total Orders</span><strong id="totalOrders">0</strong></div>
      <div class="stat"><span>Total Revenue</span><strong id="totalRevenue">₹0.00</strong></div>
      <div class="stat"><span>Collected</span><strong id="collected">₹0.00</strong></div>
      <div class="stat"><span>Pending</span><strong id="pending">₹0.00</strong></div>
    </section>

    <section class="layout">
      <form class="card" id="orderForm">
        <h2>Add a New Order</h2>

        <div class="field">
          <label for="customerName">Customer Name</label>
          <input id="customerName" required maxlength="60" placeholder="e.g. Priya Sharma">
        </div>

        <div class="field">
          <label for="phone">Phone Number</label>
          <input id="phone" required inputmode="numeric" pattern="[0-9]{10}" maxlength="10" placeholder="10-digit number">
        </div>

        <div class="field">
          <label for="item">Item</label>
          <input id="item" required maxlength="60" placeholder="e.g. Chocolate Cake">
        </div>

        <div class="two-columns">
          <div class="field">
            <label for="quantity">Quantity</label>
            <input id="quantity" type="number" required min="1" max="50" value="1">
          </div>
          <div class="field">
            <label for="price">Price per Unit</label>
            <input id="price" type="number" required min="0.01" step="0.01" placeholder="0.00">
          </div>
        </div>

        <div class="two-columns">
          <div class="field">
            <label for="orderDate">Order Date</label>
            <input id="orderDate" type="date" required>
          </div>
          <div class="field">
            <label for="pickupDate">Pickup Date</label>
            <input id="pickupDate" type="date" required>
          </div>
        </div>

        <div class="field">
          <label for="amountPaid">Amount Paid</label>
          <input id="amountPaid" type="number" required min="0" step="0.01" value="0">
        </div>

        <div class="field">
          <label for="notes">Notes</label>
          <textarea id="notes" maxlength="200" placeholder="Cake message, decoration, or special request"></textarea>
        </div>

        <button class="primary" type="submit">Add Order</button>
      </form>

      <section class="card">
        <h2>Recent Orders</h2>
        <div class="toolbar">
          <input class="search" id="search" type="search" placeholder="Search name or item">
          <select class="status-filter" id="statusFilter">
            <option value="All">All statuses</option>
            <option value="Paid">Paid</option>
            <option value="Partial">Partial</option>
            <option value="Unpaid">Unpaid</option>
          </select>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Customer</th>
                <th>Item</th>
                <th>Pickup</th>
                <th>Total</th>
                <th>Status</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="orderRows"></tbody>
          </table>
        </div>
      </section>
    </section>
  </main>

  <script>
    const STORAGE_KEY = "bakeryOrders";
    const form = document.getElementById("orderForm");
    const orderRows = document.getElementById("orderRows");
    const searchInput = document.getElementById("search");
    const statusFilter = document.getElementById("statusFilter");
    let orders = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");

    // Format a number as Indian currency for the browser UI.
    function money(value) {
      return "₹" + Number(value).toFixed(2);
    }

    // Calculate and apply each order's payment status from amount paid.
    function paymentStatus(order) {
      if (order.amountPaid <= 0) return "Unpaid";
      if (order.amountPaid >= order.total) return "Paid";
      return "Partial";
    }

    // Save orders to localStorage, the browser equivalent of a local JSON file.
    function saveOrders() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(orders));
    }

    // Render summary cards and the filtered order table.
    function render() {
      const keyword = searchInput.value.trim().toLowerCase();
      const status = statusFilter.value;
      const filtered = orders.filter((order) => {
        const matchesText =
          order.customerName.toLowerCase().includes(keyword) ||
          order.item.toLowerCase().includes(keyword);
        const matchesStatus = status === "All" || order.status === status;
        return matchesText && matchesStatus;
      });

      const revenue = orders.reduce((sum, order) => sum + order.total, 0);
      const collected = orders.reduce((sum, order) => sum + order.amountPaid, 0);

      document.getElementById("totalOrders").textContent = orders.length;
      document.getElementById("totalRevenue").textContent = money(revenue);
      document.getElementById("collected").textContent = money(Math.min(collected, revenue));
      document.getElementById("pending").textContent = money(Math.max(revenue - collected, 0));

      if (filtered.length === 0) {
        orderRows.innerHTML = '<tr><td class="empty" colspan="7">No orders found.</td></tr>';
        return;
      }

      orderRows.innerHTML = filtered.map((order) => `
        <tr>
          <td>#${order.id}</td>
          <td>${escapeHtml(order.customerName)}</td>
          <td>${escapeHtml(order.item)}</td>
          <td>${order.pickupDate}</td>
          <td>${money(order.total)}</td>
          <td><span class="badge ${order.status}">${order.status}</span></td>
          <td><button class="delete" type="button" data-id="${order.id}" title="Delete order">Delete</button></td>
        </tr>
      `).join("");
    }

    // Prevent customer-entered text from being treated as HTML.
    function escapeHtml(text) {
      const element = document.createElement("div");
      element.textContent = text;
      return element.innerHTML;
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();

      const quantity = Number(document.getElementById("quantity").value);
      const price = Number(document.getElementById("price").value);
      const amountPaid = Number(document.getElementById("amountPaid").value);
      const orderDate = document.getElementById("orderDate").value;
      const pickupDate = document.getElementById("pickupDate").value;

      if (!/^[0-9]{10}$/.test(document.getElementById("phone").value)) {
        alert("Phone number must contain exactly 10 digits.");
        return;
      }

      if (quantity < 1 || quantity > 50) {
        alert("Quantity must be between 1 and 50.");
        return;
      }

      if (price <= 0) {
        alert("Price must be greater than zero.");
        return;
      }

      if (pickupDate < orderDate) {
        alert("Pickup date cannot be before the order date.");
        return;
      }

      const total = Math.round(quantity * price * 100) / 100;
      const safeAmountPaid = Math.min(Math.max(amountPaid, 0), total);
      const order = {
        id: orders.length ? Math.max(...orders.map((item) => item.id)) + 1 : 1,
        customerName: document.getElementById("customerName").value.trim(),
        phone: document.getElementById("phone").value,
        item: document.getElementById("item").value.trim(),
        quantity,
        price,
        orderDate,
        pickupDate,
        amountPaid: safeAmountPaid,
        total,
        notes: document.getElementById("notes").value.trim()
      };
      order.status = paymentStatus(order);

      orders.unshift(order);
      saveOrders();
      form.reset();
      setDefaultDates();
      render();
    });

    orderRows.addEventListener("click", (event) => {
      if (!event.target.matches(".delete")) return;
      const id = Number(event.target.dataset.id);
      if (confirm("Delete this order?")) {
        orders = orders.filter((order) => order.id !== id);
        saveOrders();
        render();
      }
    });

    searchInput.addEventListener("input", render);
    statusFilter.addEventListener("change", render);

    // Set today as the default order date and today as the initial pickup date.
    function setDefaultDates() {
      const today = new Date();
      const todayText = today.toISOString().split("T")[0];
      document.getElementById("orderDate").value = todayText;
      document.getElementById("pickupDate").value = todayText;
      document.getElementById("pickupDate").min = todayText;
    }

    const now = new Date();
    document.getElementById("today").textContent =
      now.toLocaleDateString("en-IN", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
    setDefaultDates();
    render();
  </script>
</body>
</html>
